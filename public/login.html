<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión Comercial - Control de Ventas e Inventario</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    body {
      background: #111315;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      margin: 0;
    }
    .login-card {
      width: 100%;
      max-width: 440px;
      background: #181A1D;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 38px 32px;
      box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.7);
    }
    .login-brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 28px;
      text-align: center;
    }
    .login-brand-icon {
      width: 56px;
      height: 56px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--primary), #0d9488);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      color: #111315;
      box-shadow: 0 6px 20px var(--primary-glow);
      margin-bottom: 14px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      font-size: 0.8rem;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: 0.5px;
    }
    .form-control-wrap {
      position: relative;
    }
    .form-control-wrap i {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-dim);
    }
    .form-control-wrap input {
      width: 100%;
      background: var(--bg-main);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 13px 14px 13px 42px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s;
    }
    .form-control-wrap input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-glow);
    }
    .btn-login {
      width: 100%;
      padding: 13px;
      border-radius: 10px;
      background: var(--primary);
      border: none;
      color: #111315;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 14px var(--primary-glow);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.2s;
      margin-top: 24px;
    }
    .btn-login:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <div id="toast-container"></div>

  <div class="login-card">
    <div class="login-brand">
      <div class="login-brand-icon">
        <i class="fa-solid fa-store"></i>
      </div>
      <h1 style="font-size: 1.35rem; font-weight: 800; color: #fff; margin-bottom: 4px; letter-spacing: 0.5px;">SISTEMA DE GESTIÓN COMERCIAL</h1>
      <p style="font-size: 0.82rem; color: var(--primary); font-weight: 700;">Control de Inventarios & Facturación</p>
    </div>

    <form id="form-login" onsubmit="iniciarSesion(event)">
      <div class="form-group">
        <label for="correo">Correo Electrónico</label>
        <div class="form-control-wrap">
          <i class="fa-solid fa-envelope"></i>
          <input type="email" id="correo" required placeholder="usuario@comercio.com" autocomplete="username">
        </div>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <div class="form-control-wrap">
          <i class="fa-solid fa-lock"></i>
          <input type="password" id="password" required placeholder="••••••••" autocomplete="current-password">
        </div>
      </div>

      <button type="submit" id="btn-submit" class="btn-login">
        <i class="fa-solid fa-arrow-right-to-bracket"></i>
        <span>Iniciar Sesión</span>
      </button>
    </form>
  </div>

  <script>
    function mostrarToast(mensaje, tipo = 'info') {
      const c = document.getElementById('toast-container');
      if (!c) return;
      const t = document.createElement('div');
      t.className = `toast toast-${tipo}`;
      t.innerHTML = `<i class="fa-solid fa-info-circle"></i> <span>${mensaje}</span>`;
      c.appendChild(t);
      setTimeout(() => {
        t.style.opacity = '0';
        setTimeout(() => t.remove(), 300);
      }, 4000);
    }

    async function iniciarSesion(e) {
      e.preventDefault();
      const correo = document.getElementById('correo').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('btn-submit');

      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Validando credenciales...';

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ correo, password })
        });
        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error || 'Credenciales inválidas o usuario inactivo');
        }

        // Guardar sesión en el navegador
        localStorage.setItem('pos_usuario', JSON.stringify({
          id_usuario: data.id_usuario,
          id_sesion: data.id_sesion,
          nombre: data.nombre,
          correo: data.correo,
          rol: data.rol,
          id_rol: data.id_rol
        }));

        mostrarToast(`¡Bienvenido, ${data.nombre}! Ingresando al sistema...`, 'success');
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 600);
      } catch (err) {
        mostrarToast(err.message, 'danger');
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-arrow-right-to-bracket"></i> <span>Iniciar Sesión</span>';
      }
    }
  </script>
</body>
</html>
